// Flutter plugins build as a Gradle subproject of the host app, so this file
// inherits the app's toolchain rather than pinning its own. Pinning AGP and
// Kotlin here (as the previous version did) forces a version on every consumer
// and breaks any app on a different one.
group 'com.stay22.flutter'
version '1.3.0'

buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Flutter creates a `flutter` extension on plugin subprojects so they can use
// the SDK's vended compile/target versions. It is absent on older Flutter, so
// fall back rather than break those hosts.
def flutterExt = project.extensions.findByName('flutter')
def resolvedCompileSdk = (flutterExt != null && flutterExt.hasProperty('compileSdkVersion'))
        ? flutterExt.compileSdkVersion
        : safeExtGet('compileSdkVersion', 34)

// Rewritten by scripts/sync-binaries.sh and checked by flutter-test.yml.
def stay22SdkVersion = "1.3.0"

android {
    namespace "com.stay22.flutter"
    // Tracks the host app, so AGP's AAR metadata check passes as the host moves.
    compileSdk resolvedCompileSdk

    defaultConfig {
        // Hard-coded on purpose, unlike compileSdk above. It tracks the uses-sdk
        // minSdkVersion of the pinned `com.stay22:sdk` AAR, so a host below that
        // floor gets a clear "raise your minSdk" message instead of a confusing
        // manifest merge failure. Move it only when a published AAR advertises a
        // different floor, and change the plugin README with it.
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        // The guard under test runs before the plugin touches any Android API, so
        // these tests need no emulator and no Robolectric. Returning defaults rather
        // than throwing keeps an incidental android.jar call (a Log line on a path a
        // test happens to cross) from failing a test about something else.
        unitTests.returnDefaultValues = true
    }
}

// No `repositories {}` block here, deliberately, and the host app has to declare
// Stay22's Maven repository itself — see this package's README. Flutter's own Gradle
// tooling sets RepositoriesMode.FAIL_ON_PROJECT_REPOS
// (flutter_tools/gradle/settings.gradle.kts), so any repository a plugin declares
// for itself is ignored. That is also why the SDK is not vendored the way the iOS
// framework is: a bundled Maven repo would be unreachable, and AGP rejects a local
// .aar file dependency in a library module outright.
//
// Resolving the published coordinate means the POM comes with it, so transitive
// dependencies are Gradle's problem rather than something this file has to
// restate.
dependencies {
    implementation "com.stay22:sdk:${stay22SdkVersion}"

    testImplementation "junit:junit:4.13.2"
}
